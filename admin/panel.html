<!DOCTYPE html>

  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@300;400;500;600;700;800&family=Noto+Serif+Bengali:wght@400;600;700&display=swap" rel="stylesheet"/>

<body class="admin-body">

<!-- ══ LOGIN SCREEN ══ -->
<div id="loginScreen" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#032418,#0a2418,#163d2e)">
  <div style="background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:40px;max-width:400px;width:100%;backdrop-filter:blur(16px)">
    <div style="text-align:center;margin-bottom:28px">
      <div style="width:72px;height:72px;border-radius:50%;overflow:hidden;margin:0 auto 12px;border:2px solid rgba(201,162,39,.4)">
        <img src="../image/logo.png" alt="লোগো" style="width:100%;height:100%;object-fit:cover"/>
      </div>
      <h2 style="font-family:'Noto Serif Bengali',serif;color:#fff;font-size:1.5rem;margin-bottom:4px">বারাকাহ ফাইন্যান্স</h2>
      <p style="color:rgba(255,255,255,.5);font-size:.85rem">অ্যাডমিন প্যানেল</p>
    </div>
    <div style="margin-bottom:14px">
      <label style="display:block;font-size:.82rem;color:rgba(255,255,255,.7);margin-bottom:6px">আইডি / ইউজারনেম / মোবাইল</label>
      <input id="liId" type="text" placeholder="admin" style="width:100%;padding:12px 14px;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.15);border-radius:10px;color:#fff;font-family:'Noto Sans Bengali',sans-serif;font-size:.9rem;outline:none" onkeydown="if(event.key==='Enter')doAdminLogin()"/>
    </div>
    <div style="margin-bottom:18px">
      <label style="display:block;font-size:.82rem;color:rgba(255,255,255,.7);margin-bottom:6px">পাসওয়ার্ড</label>
      <div style="position:relative">
        <input id="liPw" type="password" placeholder="••••••••" style="width:100%;padding:12px 40px 12px 14px;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.15);border-radius:10px;color:#fff;font-family:'Noto Sans Bengali',sans-serif;font-size:.9rem;outline:none" onkeydown="if(event.key==='Enter')doAdminLogin()"/>
        <button onclick="const i=document.getElementById('liPw');i.type=i.type==='password'?'text':'password'" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:rgba(255,255,255,.5);font-size:1rem">👁</button>
      </div>
    </div>
    <p id="loginErr" style="color:#f87171;font-size:.82rem;margin-bottom:12px;display:none"></p>
    <button onclick="doAdminLogin()" style="width:100%;padding:13px;background:linear-gradient(135deg,#1D9E75,#0f7a57);border:none;border-radius:10px;color:#fff;font-family:'Noto Sans Bengali',sans-serif;font-size:1rem;font-weight:700;cursor:pointer">লগইন করুন</button>
  </div>
</div>
