<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>লেজার | বারাকাহ ফাইন্যান্স</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@300;400;500;600;700;800&family=Noto+Serif+Bengali:wght@400;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../style/design-system.css"/>
  <link rel="stylesheet" href="../style/landing.css"/>
  <link rel="stylesheet" href="../style/pages.css"/>
</head>
<body>
<nav id="mainNav" style="height:60px">
  <div class="nav-inner" style="height:60px">
    <a href="../index.html" class="nav-logo">
      <div class="nav-logo-img" style="width:40px;height:40px"><img src="../image/logo.png" alt="লোগো"/></div>
      <div class="nav-logo-text"><span class="nav-logo-name" style="font-size:.9rem">বারাকাহ ফাইন্যান্স</span></div>
    </a>
    <div class="nav-controls">
      <button class="nav-theme-btn" id="themeToggle"><span id="themeIcon">🌙</span></button>
      <div class="nav-user" id="navUser">
        <div class="nav-user-avatar" id="navUserAvatar" onclick="toggleUserMenu()">অ</div>
        <div class="nav-user-menu hidden" id="userMenu">
          <div class="user-menu-header"><div class="user-menu-name" id="userMenuName">ব্যবহারকারী</div><div class="user-menu-role" id="userMenuRole">গ্রাহক</div></div>
          <a href="dashboard.html" class="user-menu-item">📊 ড্যাশবোর্ড</a>
          <button class="user-menu-item danger" onclick="doLogout()">🚪 লগআউট</button>
        </div>
      </div>
    </div>
  </div>
</nav>

<div class="container" style="padding-top:80px;padding-bottom:60px">
  <div style="display:flex;align-items:center;gap:16px;margin-bottom:24px;flex-wrap:wrap">
    <a href="dashboard.html" class="btn btn-ghost btn-sm">← ড্যাশবোর্ড</a>
    <h1 style="font-size:1.5rem;font-family:var(--font-serif)">📋 আমার লেজার</h1>
    <div style="margin-left:auto;display:flex;gap:8px">
      <button class="btn btn-outline btn-sm" onclick="printLedger()">🖨️ প্রিন্ট</button>
      <button class="btn btn-ghost btn-sm" onclick="exportCSV()">📥 CSV</button>
    </div>
  </div>

  <!-- Summary cards -->
  <div class="stats-row" style="margin-bottom:24px" id="ledgerStats"></div>

  <!-- Filter row -->
  <div class="search-bar" style="margin-bottom:16px">
    <div class="form-group" style="margin:0">
      <select class="filter-select" id="ledgerType" onchange="loadLedger()">
        <option value="">সব ধরন</option>
        <option value="income">আয়</option>
        <option value="expense">ব্যয়</option>
        <option value="savings">সঞ্চয়</option>
        <option value="loan">করজ</option>
        <option value="installment">কিস্তি</option>
      </select>
    </div>
    <input type="date" class="form-input" id="ledgerFrom" style="width:150px" onchange="loadLedger()"/>
    <span style="color:var(--text-muted);align-self:center">থেকে</span>
    <input type="date" class="form-input" id="ledgerTo" style="width:150px" onchange="loadLedger()"/>
    <button class="btn btn-primary btn-sm" onclick="loadLedger()">🔍 খোঁজুন</button>
  </div>

  <!-- Ledger Table -->
  <div class="table-wrap">
    <table id="ledgerTable">
      <thead>
        <tr>
          <th>#</th>
          <th>তারিখ</th>
          <th>ধরন</th>
          <th>বিবরণ</th>
          <th>আয় (৳)</th>
          <th>ব্যয় (৳)</th>
          <th>রিসিট</th>
        </tr>
      </thead>
      <tbody id="ledgerTbody">
        <tr><td colspan="7" style="text-align:center;padding:30px;color:var(--text-muted)"><div class="spinner" style="margin:0 auto"></div></td></tr>
      </tbody>
    </table>
  </div>
  <div style="text-align:right;padding:12px 16px;font-size:.9rem;font-weight:700;color:var(--text-primary)" id="ledgerTotal"></div>
</div>

<div class="toast-container" id="toastContainer"></div>
<script src="../js/db.js"></script>
<script src="../js/api.js"></script>
<script src="../js/app.js"></script>
<script src="../js/notice.js"></script>
<script src="js/ledger.js"></script>
</body>
</html>
